[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "house-prices"
version = "0.1.0"
description = "What is this house worth? Millbrook's sales, modelled."
requires-python = ">=3.15"
dependencies = ["pandas==3.1.0", "numpy==2.5.4", "scikit-learn==1.9.1"]

[project.scripts]
house-prices = "house_prices.cli:main"

[tool.setuptools]
packages = ["house_prices"]

[dependency-groups]
notebook = [
    "pandas==3.1.0",
    "numpy==2.5.4",
    "matplotlib==3.11.2",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "jupyterlab==4.6.4",
]
dev = ["pytest==9.1.1"]
